<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Payer AI Splitter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6 font-sans text-slate-800">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
        
        <div class="border-b pb-4 mb-6">
            <h1 class="text-3xl font-extrabold text-indigo-900">🧾 Multi-Payer Bill Splitter</h1>
            <p class="text-slate-500 text-sm">Split bills among any number of friends with multiple upfront payers.</p>
        </div>

        <!-- Section 1: Upload -->
        <div class="mb-6 p-4 bg-slate-50 rounded-xl border border-dashed border-slate-300">
            <label class="block text-sm font-semibold text-slate-700 mb-2">1. Upload Bill Image</label>
            <input type="file" id="receiptFile" accept="image/*" class="block w-full text-sm text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 border border-slate-200 rounded-lg p-2 bg-white" />
            <button onclick="parseReceipt()" class="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-lg transition shadow">
                Extract Items with AI
            </button>
            <p id="loading" class="hidden text-indigo-600 font-medium mt-3 text-center animate-pulse">🤖 Reading receipt...</p>
        </div>

        <!-- Section 2: Group & Multi-Payer Configurations -->
        <div id="configSection" class="hidden mb-6 p-5 bg-indigo-50 rounded-xl border border-indigo-100">
            <h2 class="text-lg font-bold text-indigo-900 mb-3">2. Group & Payment Details</h2>
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-600 mb-1">Group Members (comma separated)</label>
                <input type="text" id="friendsInput" value="Udit, Aman, Priya, Rohan" onchange="rebuildUI()" class="w-full text-sm p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
            </div>

            <label class="block text-xs font-semibold text-slate-600 mb-2">Who paid how much upfront?</label>
            <div id="payersContainer" class="space-y-2"></div>
        </div>

        <!-- Section 3: Item Checkboxes -->
        <div id="itemsSection" class="hidden mb-6">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-bold text-slate-800">3. Assign Items</h2>
                <span id="billSummary" class="text-xs font-semibold bg-slate-200 px-3 py-1 rounded-full text-slate-700"></span>
            </div>
            
            <div id="itemsContainer" class="space-y-3"></div>

            <button onclick="calculateMultiSplit()" class="mt-6 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-md">
                Compute Optimized Settlements & QRs
            </button>
        </div>

        <!-- Section 4: Settlement Cards -->
        <div id="settlementsSection" class="hidden border-t pt-6">
            <h2 class="text-xl font-bold text-slate-800 mb-4">4. Final Simplified Settlements</h2>
            <div id="netBalancesContainer" class="mb-6 grid grid-cols-2 md:grid-cols-4 gap-2"></div>
            <div id="qrContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

    </div>

    <script>
        let extractedData = null;

        async function parseReceipt() {
            const fileInput = document.getElementById('receiptFile');
            if (!fileInput.files[0]) {
                alert("Please select a receipt image first.");
                return;
            }

            document.getElementById('loading').classList.remove('hidden');
            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            try {
                const response = await fetch("http://localhost:8000/api/parse-receipt", {
                    method: "POST",
                    body: formData
                });
                
                const res = await response.json();
                
                // NEW: Handle the AI rejection gracefully!
                if (!response.ok) {
                    alert("🚨 AI REJECTION: " + res.detail);
                    return; // Stop the code here so it doesn't crash
                }

                extractedData = res.data;

                document.getElementById('billSummary').textContent = 
                    `${extractedData.store_name || 'Bill'} • Subtotal: ₹${extractedData.subtotal} • Tax: ₹${extractedData.tax || 0} • Total: ₹${extractedData.total}`;

                document.getElementById('configSection').classList.remove('hidden');
                document.getElementById('itemsSection').classList.remove('hidden');
                rebuildUI();
            } catch (err) {
                alert("Could not contact backend on port 8000. Check terminal logs.");
                console.error(err);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function getFriendsList() {
            return document.getElementById('friendsInput').value
                .split(',')
                .map(s => s.trim())
                .filter(s => s.length > 0);
        }

        function rebuildUI() {
            renderPayersInputs();
            renderItemAssignments();
        }

        function renderPayersInputs() {
            const friends = getFriendsList();
            const container = document.getElementById('payersContainer');
            container.innerHTML = '';

            friends.forEach((friend, idx) => {
                const row = document.createElement('div');
                row.className = "grid grid-cols-1 md:grid-cols-3 gap-2 items-center bg-white p-2 rounded-lg border";
                row.innerHTML = `
                    <span class="text-sm font-semibold text-slate-700">${friend}</span>
                    <input type="number" step="0.01" id="paid_${friend}" placeholder="Amount Paid (₹)" value="${idx === 0 && extractedData ? extractedData.total : 0}" class="text-sm p-1.5 border rounded focus:ring-1 focus:ring-indigo-500 outline-none" />
                    <input type="text" id="upi_${friend}" placeholder="${friend}'s UPI ID" value="${idx === 0 ? 'payer@upi' : ''}" class="text-sm p-1.5 border rounded focus:ring-1 focus:ring-indigo-500 outline-none" />
                `;
                container.appendChild(row);
            });
        }

        function renderItemAssignments() {
            const friends = getFriendsList();
            const container = document.getElementById('itemsContainer');
            container.innerHTML = '';

            if (!extractedData || !extractedData.items) return;

            extractedData.items.forEach((item, itemIdx) => {
                const card = document.createElement('div');
                card.className = "p-4 bg-white border border-slate-200 rounded-xl shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-3";
                
                const info = `
                    <div>
                        <p class="font-bold text-slate-800 text-sm">${item.name}</p>
                        <p class="text-xs text-slate-500">Qty: ${item.quantity || 1} • ₹${item.price.toFixed(2)}</p>
                    </div>
                `;

                const checkboxes = friends.map(friend => `
                    <label class="inline-flex items-center gap-1 text-xs bg-slate-50 border border-slate-200 px-2.5 py-1.5 rounded-md cursor-pointer hover:bg-slate-100">
                        <input type="checkbox" name="item_${itemIdx}" value="${friend}" checked class="rounded text-indigo-600 focus:ring-0">
                        <span>${friend}</span>
                    </label>
                `).join('');

                card.innerHTML = `${info}<div class="flex flex-wrap gap-2">${checkboxes}</div>`;
                container.appendChild(card);
            });
        }

        async function calculateMultiSplit() {
            const friends = getFriendsList();
            
            // Collect multi-payer data
            const payers = friends.map(friend => ({
                name: friend,
                amount_paid: parseFloat(document.getElementById(`paid_${friend}`).value) || 0.0,
                upi_id: document.getElementById(`upi_${friend}`).value.trim()
            }));

            // Collect item assignments
            const items = extractedData.items.map((item, idx) => {
                const checkedBoxes = document.querySelectorAll(`input[name="item_${idx}"]:checked`);
                const assigned = Array.from(checkedBoxes).map(cb => cb.value);
                return {
                    name: item.name,
                    price: item.price,
                    assigned_to: assigned
                };
            });

            const payload = {
                tax: extractedData.tax || 0,
                discount: extractedData.discount || 0,
                payers: payers,
                items: items
            };

            try {
                const response = await fetch("http://localhost:8000/api/calculate-split", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                // Display Net Balances
                const balContainer = document.getElementById('netBalancesContainer');
                balContainer.innerHTML = '';
                for (const [person, bal] of Object.entries(data.net_balances)) {
                    const isPositive = bal >= 0;
                    balContainer.innerHTML += `
                        <div class="p-3 rounded-lg border text-center ${isPositive ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}">
                            <p class="font-semibold text-xs text-slate-700">${person}</p>
                            <p class="text-sm font-bold ${isPositive ? 'text-emerald-700' : 'text-rose-700'}">${isPositive ? '+₹' + bal : '-₹' + Math.abs(bal)}</p>
                            <p class="text-[10px] text-slate-400">${isPositive ? 'Gets back' : 'Owes'}</p>
                        </div>
                    `;
                }

                // Display QR Cards
                const qrContainer = document.getElementById('qrContainer');
                qrContainer.innerHTML = '';

                if (data.settlements.length === 0) {
                    qrContainer.innerHTML = `<p class="col-span-2 text-center text-sm text-slate-500">All balances are completely settled!</p>`;
                }

                data.settlements.forEach(s => {
                    const qrSection = s.qr_code_url 
                        ? `<img src="${s.qr_code_url}" alt="UPI QR" class="w-32 h-32 border p-1 rounded-lg my-2"><p class="text-xs text-slate-400">Scan to pay ${s.to_person}</p>`
                        : `<p class="text-xs text-amber-600 my-2">No UPI ID provided for ${s.to_person}</p>`;

                    qrContainer.innerHTML += `
                        <div class="bg-white border border-slate-200 rounded-xl p-4 flex flex-col items-center text-center shadow-sm">
                            <p class="text-sm font-bold text-slate-800">${s.from_person} ➔ ${s.to_person}</p>
                            <p class="text-2xl text-emerald-600 font-extrabold my-1">₹${s.amount}</p>
                            ${qrSection}
                        </div>
                    `;
                });

                document.getElementById('settlementsSection').classList.remove('hidden');
            } catch (err) {
                alert("Error during calculation. Check terminal logs.");
                console.error(err);
            }
        }
    </script>
</body>
</html>
